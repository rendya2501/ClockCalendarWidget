name: Version Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Show next version candidates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version candidates
        run: |
          set -euo pipefail

          # 最新のバージョンタグを取得
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed -n '1p' || true)

          # タグがない場合の初期バージョン
          if [[ -z "$LATEST_TAG" ]]; then
            BASE_VERSION="1.0.0"
          else
            BASE_VERSION="${LATEST_TAG#v}"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          # 各バージョン候補を計算
          PATCH_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          MINOR_VERSION="${MAJOR}.$((MINOR + 1)).0"
          MAJOR_VERSION="$((MAJOR + 1)).0.0"

          # GitHub Actionsの実行サマリーに表示
          {
            echo "# バージョン確認"
            echo ""
            echo "現在のバージョン: **$BASE_VERSION**"
            echo ""
            echo "| 選択 | 更新後のバージョン |"
            echo "|---|---|"
            echo "| patch | \`$BASE_VERSION → $PATCH_VERSION\` |"
            echo "| minor | \`$BASE_VERSION → $MINOR_VERSION\` |"
            echo "| major | \`$BASE_VERSION → $MAJOR_VERSION\` |"
            echo ""
            echo "## リリース手順"
            echo ""
            echo "1. 上記の候補から希望するバージョンを確認"
            echo "2. **Build and Release APK** を実行"
            echo "3. 対応するバージョンアップの種類を選択"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Current version: $BASE_VERSION"
          echo "patch: $PATCH_VERSION"
          echo "minor: $MINOR_VERSION"
          echo "major: $MAJOR_VERSION"
