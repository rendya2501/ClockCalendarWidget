name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "バージョンアップの種類"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: manual-apk-release
  cancel-in-progress: false

jobs:
  preview:
    name: Show current version and candidates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show version candidates
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          set -euo pipefail

          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed -n '1p' || true)

          if [[ -z "$LATEST_TAG" ]]; then
            BASE_VERSION="1.0.0"
          else
            BASE_VERSION="${LATEST_TAG#v}"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          {
            echo "## 現在のバージョン: **$BASE_VERSION**"
            echo ""
            echo "| 選択 | 更新後のバージョン |"
            echo "|---|---|"
            echo "| patch | \`$BASE_VERSION → ${MAJOR}.${MINOR}.$((PATCH + 1))\` |"
            echo "| minor | \`$BASE_VERSION → ${MAJOR}.$((MINOR + 1)).0\` |"
            echo "| major | \`$BASE_VERSION → $((MAJOR + 1)).0.0\` |"
            echo ""
            echo "今回の選択: **$VERSION_BUMP**"
            echo ""
            echo "問題なければ **Review deployments** から承認してください。違っていれば Reject してやり直します。"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build signed APK and publish Release
    needs: preview
    environment: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # 再実行では同じversionCodeになるため、再実行を禁止
          if [[ "$RUN_ATTEMPT" -ne 1 ]]; then
            echo "::error::このワークフローは再実行できません。新しい実行を開始してください。"
            exit 1
          fi

          # 最新のバージョンタグを取得
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed -n '1p' || true)

          # タグがない場合の初期バージョン
          if [[ -z "$LATEST_TAG" ]]; then
            BASE_VERSION="1.0.0"
          else
            BASE_VERSION="${LATEST_TAG#v}"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          # バージョンアップ候補を計算
          PATCH_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          MINOR_VERSION="${MAJOR}.$((MINOR + 1)).0"
          MAJOR_VERSION="$((MAJOR + 1)).0.0"

          # 選択された種類に応じてバージョンを決定
          case "$VERSION_BUMP" in
            patch)
              VERSION_NAME="$PATCH_VERSION"
              ;;
            minor)
              VERSION_NAME="$MINOR_VERSION"
              ;;
            major)
              VERSION_NAME="$MAJOR_VERSION"
              ;;
            *)
              echo "::error::不正なversion_bumpです"
              exit 1
              ;;
          esac

          # versionCodeはActionsの実行番号から自動採番
          VERSION_CODE=$((RUN_NUMBER + 1))

          # 既存タグとの重複を確認
          if git rev-parse -q --verify "refs/tags/v$VERSION_NAME" >/dev/null; then
            echo "::error::タグ v$VERSION_NAME は既に存在します"
            exit 1
          fi

          # 後続ステップに値を渡す
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          # GitHub Actionsの実行サマリーにバージョン一覧を表示
          {
            echo "## リリースバージョン"
            echo ""
            echo "現在のバージョン: **$BASE_VERSION**"
            echo ""
            echo "| 選択 | 次のバージョン |"
            echo "|---|---|"
            echo "| patch | \`$BASE_VERSION → $PATCH_VERSION\` |"
            echo "| minor | \`$BASE_VERSION → $MINOR_VERSION\` |"
            echo "| major | \`$BASE_VERSION → $MAJOR_VERSION\` |"
            echo ""
            echo "今回の選択: **$VERSION_BUMP**"
            echo ""
            echo "リリースバージョン: **$VERSION_NAME**"
            echo ""
            echo "versionCode: **$VERSION_CODE**"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Base version: $BASE_VERSION"
          echo "Release version: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${KEYSTORE_BASE64:?GitHub Secret KEYSTORE_BASE64 が未設定です}"
          : "${KEYSTORE_PASSWORD:?GitHub Secret KEYSTORE_PASSWORD が未設定です}"
          : "${KEY_ALIAS:?GitHub Secret KEY_ALIAS が未設定です}"
          : "${KEY_PASSWORD:?GitHub Secret KEY_PASSWORD が未設定です}"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="$VERSION_CODE"
            
      - name: Rename release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/clock-calendar-widget-release-v${VERSION_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: v${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/clock-calendar-widget-release-v${{ steps.version.outputs.version_name }}.apk
          fail_on_unmatched_files: true
